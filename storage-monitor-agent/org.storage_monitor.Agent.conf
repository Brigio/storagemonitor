<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>

    <!-- Solo root può possedere il servizio -->
    <policy user="root">
        <allow own="org.storage_monitor.Agent"/>
        <allow send_destination="org.storage_monitor.Agent"/>
    </policy>

    <!--
         Gli utenti possono raggiungere il daemon.
         Le operazioni privilegiate vengono autorizzate
         dal daemon tramite Polkit.
    -->
    <policy context="default">
        <deny own="org.storage_monitor.Agent"/>
        <allow send_destination="org.storage_monitor.Agent"/>
    </policy>

</busconfig>
